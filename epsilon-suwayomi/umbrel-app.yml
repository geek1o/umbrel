description: >-
  Suwayomi is a free and open source manga reader server that runs extensions
  built for Mihon (Tachiyomi).

  Install sources as extensions, browse and search your library from the built-in
  web UI, download chapters for offline reading, and sync progress with trackers
  such as MyAnimeList, AniList, Kitsu and Bangumi. An OPDS endpoint lets external
  readers pull chapters directly from the server.

  Suwayomi is independent software compatible with Mihon (Tachiyomi) — it is not a fork.

